# Unit tests and the core purity check on every push. These need only Zig, so
# CI skips the Ghostty checkout and the GTK build. scripts/test.sh is the
# single list of what runs; run it locally to get the same result.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests and core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: scripts/test.sh
