<!-- A private session bus for isolated test instances; see "Isolated test
     instances" in docs/development.md, which shows how to pass it to
     dbus-run-session.

     It's the stock session config minus every service directory, so the bus
     can't start real services such as xdg-desktop-portal. A portal started
     on a private bus crashes when the bus shuts down at the end of the test
     (xdg-desktop-portal-hyprland 1.4.1), which left a core dump per run.
     Start anything a test needs, like a fake notification daemon, by hand. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
